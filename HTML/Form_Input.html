<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form_Input</title>
</head>
<body>
  <h1>Forms in HTML</h1>
    <form action="url" method="get" accept-charset="UTF-8" autocomplete="off" enctype="" novalidate target="_blank">
      <label for="fname">First Name</label> 
      <br />
      <input type="text" placeholder="First Name" name="" value="Hitesh" id="fname">

      <input type="week" name="" id="">
      <input type="reset" value="reset">

      <select name="editor" id="" multiple>
        <option value="vs code">Default</option>
        <option value="sublime">Vim</option>
      </select>

      <input list="editors" name="editor">
      <detailist id="editors">
      <option value="vs code">Default</option>
      <option value="sublime">Sublime</option>
      </detailist>
      <input type="email" name="" id="">

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
