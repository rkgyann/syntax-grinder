<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Tag</title>
  <style>
    body{
        background-color: #414141;
    }
  </style>
</head>
<body>
  <img src="https://plus.unsplash.com/premium_photo-1781710760389-dbc993cf7e0e?w=1400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw2fHx8ZW58MHx8fHx8" width="700px" alt="No Image">

  <br />

  <img src="./Scenery.jpeg" width="700px" alt="No Image">

  <br />
  <picture>
    <source media="(min-width: 650px)" srcset="./Scenery.jpeg" />
    <source media="(min-width: 460px)" srcset="./Scenery2.jpeg" />
    <img src="./Scenery.jeg" width="700px" alt="">
  </picture>

</body>
</html>
